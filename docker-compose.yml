# YapBoard in production: site + bot, served at yapboard.dev, portal.yapboard.dev, platform.yapboard.dev and api.yapboard.dev through a Cloudflare Tunnel
# (cloudflared -> Caddy -> site). No ports are opened on the host.
# cp .env.example .env, fill it in, then: docker compose up -d --build

x-shared: &shared
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
  YAPPER_BOT_TOKEN: ${YAPPER_BOT_TOKEN:-}

services:
  site:
    build:
      context: ./Site
      # Baked in at build time: rebuild after changing these.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_BOT_ID: ${NEXT_PUBLIC_BOT_ID:-}
        PORTAL_URL: ${PORTAL_URL:?set PORTAL_URL in .env}
        PLATFORM_URL: ${PLATFORM_URL:-}
        NEXT_PUBLIC_BUG_REPORT_URL: ${NEXT_PUBLIC_BUG_REPORT_URL:-}
    restart: unless-stopped
    environment:
      <<: *shared
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_BOT_ID: ${NEXT_PUBLIC_BOT_ID:-}
      PORTAL_URL: ${PORTAL_URL}
      PLATFORM_URL: ${PLATFORM_URL:-}
      API_URL: ${API_URL:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      YAPIN_CLIENT_ID: ${YAPIN_CLIENT_ID:-}
      YAPIN_CLIENT_SECRET: ${YAPIN_CLIENT_SECRET:-}
      # Optional: only raises GitHub's rate limit when reading client releases.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      STAFF_IDS: ${STAFF_IDS:-}
      # The one account that owns YapBoard, for the badge beside their name. Falls back to the first
      # STAFF_IDS entry when unset, which is usually the same person (Site/src/lib/env.ts).
      OWNER_ID: ${OWNER_ID:-}
      # YapBoard Pro. All six or none: billingEnabled() (Site/src/lib/env.ts) answers 503 on every
      # billing route unless the key, the webhook secret and all four price ids are present, so a
      # half-filled .env refuses to take money rather than taking it and granting nothing.
      # Runtime only, never build args - a secret passed to a build is baked into an image layer.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO_MONTHLY: ${STRIPE_PRICE_PRO_MONTHLY:-}
      STRIPE_PRICE_PRO_ANNUAL: ${STRIPE_PRICE_PRO_ANNUAL:-}
      STRIPE_PRICE_SLOT_MONTHLY: ${STRIPE_PRICE_SLOT_MONTHLY:-}
      STRIPE_PRICE_SLOT_ANNUAL: ${STRIPE_PRICE_SLOT_ANNUAL:-}
    volumes:
      - site-data:/data

  bot:
    build:
      context: ./Bot
      additional_contexts:
        sdk: ./YapinAssets
    restart: unless-stopped
    environment:
      <<: *shared
      # Links in the bot's messages use the public URL; API calls stay on the Docker network.
      YAPBOARD_URL: ${NEXT_PUBLIC_SITE_URL}
      YAPBOARD_API_URL: http://site:3000
    volumes:
      - bot-data:/app/data
    depends_on:
      site:
        condition: service_healthy

  # Internal only (no ports): blocks /api/internal/* and sets X-Real-IP from CF-Connecting-IP.
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site

  # Connects out to Cloudflare. Public hostnames are set on the tunnel in the Cloudflare dashboard:
  # yapboard.dev, portal.yapboard.dev, platform.yapboard.dev and api.yapboard.dev -> http://caddy:80
  cloudflared:
    image: cloudflare/cloudflared:2026.9.3
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:?set TUNNEL_TOKEN in .env}
    depends_on:
      - caddy

volumes:
  site-data:
  bot-data:
  caddy-data:
  caddy-config:
