# YapBoard in production: site + bot + Caddy (HTTPS for yapboard.dev and portal.yapboard.dev).
# cp .env.example .env, fill it in, then: docker compose up -d --build

x-shared: &shared
  INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:?set INTERNAL_API_SECRET in .env}
  YAPPER_BOT_TOKEN: ${YAPPER_BOT_TOKEN:-}

services:
  site:
    build:
      context: ./Site
      # Baked in at build time: rebuild after changing these.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_BOT_ID: ${NEXT_PUBLIC_BOT_ID:-}
        PORTAL_URL: ${PORTAL_URL:?set PORTAL_URL in .env}
    restart: unless-stopped
    environment:
      <<: *shared
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      NEXT_PUBLIC_BOT_ID: ${NEXT_PUBLIC_BOT_ID:-}
      PORTAL_URL: ${PORTAL_URL}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      YAPIN_CLIENT_ID: ${YAPIN_CLIENT_ID:-}
      YAPIN_CLIENT_SECRET: ${YAPIN_CLIENT_SECRET:-}
      STAFF_IDS: ${STAFF_IDS:-}
    volumes:
      - site-data:/data

  bot:
    build:
      context: ./Bot
      additional_contexts:
        sdk: ./YapinAssets
    restart: unless-stopped
    environment:
      <<: *shared
      # Links in the bot's messages use the public URL; API calls stay on the Docker network.
      YAPBOARD_URL: ${NEXT_PUBLIC_SITE_URL}
      YAPBOARD_API_URL: http://site:3000
    volumes:
      - bot-data:/app/data
    depends_on:
      site:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      PORTAL_URL: ${PORTAL_URL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - site

volumes:
  site-data:
  bot-data:
  caddy-data:
  caddy-config:
