<html lang="en">
<head>

<title>Down for maintenance &middot; YapBoard</title>
<meta name="description" content="YapBoard is down for a short while for maintenance." />
<meta name="author" content="Christian Relf" />
<meta name="copyright" content="Copyright (c) 2026 Christian Relf. All rights reserved." />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%23ff6b4a'/><path d='M8.5 9.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H15l-4.2 3.4c-.5.4-1.3 0-1.3-.6v-2.8h-1a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z' fill='%23fff'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  /* Yapin' palette: the same tokens as the app's globals.css. */
  :root {
    --bg: #111214;
    --surface-2: #222329;
    --surface-3: #2b2c33;
    --line-strong: #363740;
    --ink: #f2f3f5;
    --ink-2: #b5b8bf;
    --ink-3: #7f828c;
    --accent: #ff6b4a;
    --accent-hover: #ff8063;
    --accent-press: #f2552f;
    --accent-soft: #ff6b4a1f;
    --on-accent: #1d0d07;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --sans: 'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif;
    --display: 'Bricolage Grotesque', 'Inter', ui-sans-serif, system-ui, sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    color-scheme: dark;
    background: var(--bg);
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    margin: 0;
    min-height: 100dvh;
    display: grid;
    grid-template-rows: 1fr auto;
    /* No background here: html carries it, so the dot grid below can sit on top of it. */
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  ::selection { background: var(--accent); color: var(--on-accent); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 8px; }

  /* Dot grid behind the character, faded out towards the edges. */
  .dots {
    position: fixed;
    inset: 0;
    z-index: -1;
    background-image: radial-gradient(circle at 1px 1px, #ffffff14 1px, transparent 0);
    background-size: 22px 22px;
    -webkit-mask-image: radial-gradient(ellipse 65% 55% at 50% 38%, #000 25%, transparent 75%);
    mask-image: radial-gradient(ellipse 65% 55% at 50% 38%, #000 25%, transparent 75%);
  }

  main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 48px 16px 28px;
    text-align: center;
  }

  /* ---------- the character ---------- */
  .stage {
    position: relative;
    width: 100%;
    max-width: 290px;
    margin-bottom: 12px;
  }
  .stage::before {
    content: '';
    position: absolute;
    inset: -18%;
    background: radial-gradient(circle at 50% 46%, var(--accent-soft), transparent 58%);
  }
  .mascot {
    position: relative;
    display: block;
    width: 100%;
    height: auto;
    overflow: visible;
  }

  .bob { animation: bob 5s ease-in-out infinite; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-6px) rotate(-1.2deg); }
  }

  /* One slow, half-hearted tap of the hammer. */
  .arm {
    transform-box: fill-box;
    transform-origin: 6% 94%;
    animation: tap 3.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
  }
  @keyframes tap {
    0%, 55%, 100% { transform: rotate(0deg); }
    73%           { transform: rotate(-20deg); }
    85%           { transform: rotate(5deg); }
  }

  .shadow {
    transform-box: fill-box;
    transform-origin: center;
    animation: shadow 5s ease-in-out infinite;
  }
  @keyframes shadow {
    0%, 100% { opacity: 0.5; transform: scaleX(1); }
    50%      { opacity: 0.3; transform: scaleX(0.9); }
  }

  .drop {
    transform-box: fill-box;
    transform-origin: center;
    animation: drop 3.2s ease-in infinite;
  }
  @keyframes drop {
    0%, 42%   { opacity: 0; transform: translateY(0) scale(0.6); }
    56%       { opacity: 1; transform: translateY(0) scale(1); }
    90%, 100% { opacity: 0; transform: translateY(26px) scale(0.75); }
  }

  /* ---------- copy ---------- */
  .code {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  h1 {
    font-family: var(--display);
    font-weight: 800;
    letter-spacing: -0.03em;
    font-size: clamp(30px, 7vw, 44px);
    line-height: 1.05;
    margin: 0 0 14px;
  }
  .lede {
    margin: 0;
    max-width: min(42ch, 100%);
    font-size: 16px;
    line-height: 1.6;
    color: var(--ink-2);
  }

  .actions {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-top: 26px;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 42px;
    padding: 0 18px;
    border: 0;
    border-radius: 11px;
    font: inherit;
    font-size: 14.5px;
    font-weight: 600;
    text-decoration: none;
    cursor: pointer;
    user-select: none;
    transition: background-color 0.15s, border-color 0.15s, color 0.15s, transform 0.15s var(--ease-out);
  }
  .btn:active { transform: translateY(1px) scale(0.985); }
  .btn-primary {
    background: var(--accent);
    color: var(--on-accent);
    box-shadow: inset 0 1px 0 #ffffff40, 0 1px 2px #0006;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--surface-2);
    color: var(--ink);
    border: 1px solid var(--line-strong);
  }
  .btn-secondary:hover { background: var(--surface-3); }

  .note {
    margin: 18px 0 0;
    font-size: 13px;
    color: var(--ink-3);
  }

  footer {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    padding: 24px 16px 30px;
  }
  footer .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  footer .copy {
    margin: 0;
    font-size: 12px;
    color: var(--ink-3);
    text-align: center;
  }
  footer .name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 14px;
    color: var(--ink-2);
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="dots" aria-hidden="true"></div>

<main>
  <!-- The chat-bubble logo as a character: hard hat on, hammer out, thoroughly fed up. -->
  <div class="stage">
    <svg class="mascot" viewBox="0 0 260 200" role="img" aria-label="A sad chat bubble in a hard hat, holding a hammer">
      <ellipse class="shadow" cx="130" cy="180" rx="52" ry="8" fill="#000" opacity="0.5" />

      <g class="bob">
        <!-- left arm, hanging -->
        <path d="M78 126q-16 12-20 28" fill="none" stroke="#e7e8ea" stroke-width="8" stroke-linecap="round" />

        <!-- body: the logo's speech bubble, scaled up -->
        <g transform="translate(34 6) scale(6)">
          <path d="M8.5 9.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H15l-4.2 3.4c-.5.4-1.3 0-1.3-.6v-2.8h-1a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" fill="#f2f3f5" />
        </g>

        <!-- face -->
        <g fill="#2b2c33">
          <circle cx="108" cy="97" r="7" />
          <circle cx="152" cy="97" r="7" />
        </g>
        <g fill="none" stroke="#2b2c33" stroke-linecap="round">
          <!-- brows, raised at the inner ends -->
          <path d="M99 85 117 79" stroke-width="4.5" />
          <path d="M161 85 143 79" stroke-width="4.5" />
          <!-- frown -->
          <path d="M113 119q17-12 34 0" stroke-width="5" />
        </g>

        <!-- one bead of sweat -->
        <path class="drop" d="M177 79c0 3.3-2.2 5.5-5 5.5s-5-2.2-5-5.5 5-9 5-9 5 5.7 5 9z" fill="#7dc4ff" opacity="0.9" />

        <!-- hard hat -->
        <g transform="rotate(-7 130 60)">
          <path d="M126 38h8v13h-8z" fill="var(--accent-hover)" />
          <path d="M103 62a27 24 0 0 1 54 0z" fill="var(--accent)" />
          <rect x="88" y="61" width="84" height="10" rx="5" fill="var(--accent-press)" />
        </g>

        <!-- right arm, holding the hammer -->
        <g class="arm">
          <path d="M180 118 206 96" fill="none" stroke="#e7e8ea" stroke-width="8" stroke-linecap="round" />
          <path d="M202 100 232 70" fill="none" stroke="#b9875a" stroke-width="9" stroke-linecap="round" />
          <g transform="rotate(45 232 70)">
            <rect x="217" y="62" width="30" height="16" rx="3" fill="#9aa0ab" />
            <rect x="217" y="62" width="9" height="16" rx="3" fill="#7e848f" />
          </g>
        </g>
      </g>
    </svg>
  </div>

  <!-- ===== wording: edit these three lines ===== -->
  <p class="code">503 &middot; Maintenance</p>
  <h1>Back in a bit.</h1>
  <p class="lede">YapBoard is offline while we fix a few things up. Nothing is broken on your end.</p>

  <div class="actions">
    <button class="btn btn-primary" type="button" onclick="location.reload()">Try again</button>
    <!-- PLACEHOLDER invite: put the real one here, or delete this link. -->
    <a class="btn btn-secondary" href="https://yapin.gg/invite/yapboardapp" rel="noopener">Join the Server</a>
  </div>

  <p class="note">This page checks back on its own in <span id="secs">60</span>s.</p>
</main>

<footer>
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 32 32" aria-hidden="true">
      <rect width="32" height="32" rx="9" fill="var(--accent)" />
      <path d="M8.5 9.5h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H15l-4.2 3.4c-.5.4-1.3 0-1.3-.6v-2.8h-1a2 2 0 0 1-2-2v-8a2 2 0 0 1 2-2z" fill="#fff" />
      <rect x="10" y="12.6" width="11" height="2" rx="1" fill="var(--accent)" />
      <rect x="10" y="16.4" width="7" height="2" rx="1" fill="var(--accent)" opacity=".55" />
    </svg>
    <span class="name">YapBoard</span>
  </div>
  <p class="copy">&copy; 2026 Christian Relf. All rights reserved. YapBoard, its name, design and code are proprietary.</p>
</footer>

<script>
  // Count down, then reload to see whether we are back.
  (function () {
    var el = document.getElementById('secs');
    var left = 60;
    setInterval(function () {
      left -= 1;
      if (left <= 0) {
        location.reload();
        return;
      }
      el.textContent = left;
    }, 1000);
  })();
</script>
</body>
</html>
